<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>Something I want to tell</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
<style>
:root{--rose:#ff4d7a;--blush:#ffb3c6;--gold:#f7c59f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0010;font-family:'Quicksand',system-ui,sans-serif;color:#fff;overflow-x:hidden}
@media (hover:hover) and (pointer:fine){body{cursor:none}#cursor{display:block!important}}
#cursor{display:none;position:fixed;width:18px;height:18px;background:var(--rose);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 12px var(--rose)}
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
section{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;padding:60px 20px}
#hero{text-align:center}
.hearts-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hearts-bg span{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:.8}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.hero-tag{font-size:.85rem;letter-spacing:5px;text-transform:uppercase;color:var(--blush);margin-bottom:18px;opacity:0;animation:fadeDown 1s .5s forwards}
.hero-title{font-family:'Great Vibes',cursive;font-size:clamp(3.2rem,12vw,9rem);line-height:1.1;background:linear-gradient(135deg,#ff8fab,#ff4d7a,#f7c59f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fadeDown 1s .8s forwards;filter:drop-shadow(0 0 30px rgba(255,77,122,.4))}
.hero-name{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2.5rem);color:var(--gold);margin-top:8px;opacity:0;animation:fadeDown 1s 1.1s forwards;font-style:italic}
.hero-sub{margin-top:22px;color:rgba(255,179,198,.8);letter-spacing:1px;max-width:500px;opacity:0;animation:fadeDown 1s 1.4s forwards}
.scroll-hint{position:absolute;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.3);font-size:.7rem;letter-spacing:3px;animation:bounce 2s infinite}
.scroll-hint::after{content:'↓';font-size:1.2rem}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
#cake-section{gap:70px;padding-top:140px}
.cake-msg{text-align:center;font-family:'Great Vibes',cursive;font-size:2.8rem;color:var(--blush);filter:drop-shadow(0 0 10px rgba(255,179,198,.5))}
.cake-instruction{font-size:.85rem;color:rgba(255,255,255,.5);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-top:20px}

/* ===== ENVELOPE (replaces the cake) ===== */
.env-container{position:relative}
.valentines{position:relative;top:50px;width:300px;height:200px;cursor:pointer;animation:envUp 3s linear infinite;-webkit-tap-highlight-color:transparent;perspective:1000px;touch-action:manipulation;filter:drop-shadow(0 0 28px rgba(255,77,122,.5))}
.env{position:relative;width:300px;height:200px;background:linear-gradient(145deg,#ff6f91,#c2185b);display:grid;place-items:center;overflow:visible}
.env-front{position:absolute;border-right:180px solid #b5174f;border-top:95px solid transparent;border-bottom:100px solid transparent;left:120px;top:5px;width:0;height:0;z-index:10;pointer-events:none}
.env-front::before{position:absolute;content:'';border-left:300px solid #ff8fab;border-top:195px solid transparent;left:-120px;top:-95px}
.env-card{position:absolute;left:5px;top:10px;width:286px;height:180px;place-items:center;transform:translateY(0);transition:transform .9s cubic-bezier(.22,1,.36,1);z-index:5;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.env-card img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:cover;border-radius:2px}
.valentines.is-open .env-card{transform:translateY(-150px)}
.valentines.is-open .env::before{transform:rotate(45deg) rotateX(180deg);z-index:1}
@media (hover:hover) and (pointer:fine){
  .valentines:hover .env-card{transform:translateY(-150px)}
  .valentines:hover .env::before{transform:rotate(45deg) rotateX(180deg);z-index:1}
}
.valentines::after{content:'';position:absolute;width:330px;height:25px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,77,122,.45),transparent 70%);top:215px;left:-15px;animation:envScale 3s linear infinite;z-index:-1}
@keyframes envUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes envScale{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.85)}}
@media(max-width:420px){
  .valentines{transform:scale(.82);animation-name:envUpSm}
  @keyframes envUpSm{0%,100%{transform:scale(.82) translateY(0)}50%{transform:scale(.82) translateY(-30px)}}
}

#confetti-container{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden;display:none}
.confetti-bit{position:absolute;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.section-title{font-family:'Great Vibes',cursive;font-size:clamp(2.5rem,7vw,5rem);color:var(--rose);text-align:center;margin-bottom:40px;filter:drop-shadow(0 0 15px rgba(255,77,122,.4))}
.envelope{width:min(500px,100%);border:1px solid rgba(255,77,122,.25);border-radius:20px;padding:40px;box-shadow:0 0 60px rgba(255,77,122,.1);position:relative;overflow:hidden}
.envelope::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--rose),transparent)}
.letter-text{font-size:1.05rem;line-height:2;color:rgba(255,240,245,.88);font-weight:300}
.letter-text em{color:var(--blush);font-style:normal;font-weight:600}
.letter-sign{margin-top:28px;text-align:right;font-family:'Great Vibes',cursive;font-size:2rem;color:var(--gold)}
#memories-section{gap:10px}
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(700px,100%)}
.memory-card{aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,77,122,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .3s,box-shadow .3s,border-color .3s;padding:10px;color:inherit;font:inherit}
.memory-card:hover{transform:scale(1.07) rotate(-1deg);box-shadow:0 0 30px rgba(255,77,122,.35);border-color:var(--rose)}
.memory-icon{font-size:2.2rem}
.memory-label{font-size:.7rem;letter-spacing:2px;color:rgba(255,179,198,.8);text-transform:uppercase;text-align:center}
#wish-section{text-align:center;gap:30px}
.wish-box{border:1px solid rgba(255,77,122,.2);border-radius:24px;padding:50px 40px;max-width:600px;width:100%}
.wish-text{font-family:'Great Vibes',cursive;font-size:clamp(1.8rem,5vw,3rem);color:var(--blush);line-height:1.6;margin-bottom:30px}
.btn-play{background:linear-gradient(135deg,var(--rose),#c2185b);border:none;border-radius:50px;padding:14px 40px;color:#fff;font-family:inherit;font-size:.9rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(255,77,122,.4)}
#firework-canvas{position:fixed;inset:0;pointer-events:none;z-index:400;display:none}
.petal{position:fixed;pointer-events:none;z-index:2;animation:petalFall linear infinite;opacity:.7}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0);opacity:.8}50%{transform:translateY(50vh) rotate(180deg) translateX(30px)}100%{transform:translateY(110vh) rotate(360deg) translateX(-20px);opacity:0}}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold));z-index:9000;width:0}
@media(max-width:480px){.memory-grid{gap:10px}.memory-icon{font-size:1.6rem}.envelope{padding:28px 22px}.wish-box{padding:36px 22px}}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:800;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.popup-overlay.active{opacity:1;pointer-events:all}
.popup-card{background:linear-gradient(145deg,#2a0020,#1a001a);border:1px solid rgba(255,77,122,.3);border-radius:24px;padding:50px 40px;text-align:center;max-width:420px;width:90vw;transform:scale(.8);transition:transform .4s;box-shadow:0 0 60px rgba(255,77,122,.2)}
.popup-overlay.active .popup-card{transform:scale(1)}
.popup-emoji{font-size:3.5rem;margin-bottom:16px}
.popup-title{font-family:'Great Vibes',cursive;font-size:2.5rem;color:var(--rose);margin-bottom:12px}
.popup-body{color:rgba(255,240,245,.85);line-height:1.8;font-size:.95rem}
.popup-close{margin-top:24px;background:transparent;border:1px solid var(--rose);color:var(--rose);border-radius:50px;padding:10px 30px;cursor:pointer;font-family:inherit;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

.hero-sub,.cake-instruction,.letter-text,.popup-body{text-shadow:0 1px 8px rgba(0,0,0,.7)}

.music-toggle:active{transform:scale(.96)}

</head>
<body>
<div id="bg"></div>
<div id="cursor"></div>
<div class="progress-bar" id="progress"></div>
<audio id="bgMusic" loop preload="auto">
  <source src="Last Night on Earth Green Day.mp3" type="audio/mp3">
</audio>
<button class="music-toggle" id="musicToggle" type="button" aria-label="Play background music">▶ Play Music</button>
<canvas id="stars-canvas"></canvas>
<canvas id="firework-canvas"></canvas>
<div id="confetti-container"></div>
<div id="petals"></div>

<section id="hero">
  <div class="hearts-bg" id="hearts-bg"></div>
  <h1 class="hero-title">I have something to tell you</h1>
  <div class="scroll-hint">scroll</div>
</section>

<section id="cake-section">
  <div class="env-container">
    <div class="valentines"
     id="valentines"
     role="button"
     tabindex="0"
     aria-label="Open the envelope"
     aria-expanded="false"
     onclick="setTimeout(() => location.href='letter\\letter.html', 3000)">

      <div class="env">
        <div class="env-card">
          <img src="Here we go.jpg" alt="Here I go....">
        </div>
      </div>

      <div class="env-front"></div>
    </div>
  </div>

  <p class="cake-instruction">✨ Tap the envelope to open it ✨</p>
</section>

<script>
const $=id=>document.getElementById(id);

// Tap/click the music button to play or pause the background track.
const bgMusic = $('bgMusic');
const musicToggle = $('musicToggle');
musicToggle.addEventListener('click', async () => {
  if (bgMusic.paused) {
    try {
      await bgMusic.play();
      musicToggle.textContent = '⏸ Pause Music';
      musicToggle.setAttribute('aria-label', 'Pause background music');
    } catch (error) {
      musicToggle.textContent = '▶ Tap to Play';
      console.error('Music could not play. Check that last-night-on-earth.m4a exists.', error);
    }
  } else {
    bgMusic.pause();
    musicToggle.textContent = '▶ Play Music';
    musicToggle.setAttribute('aria-label', 'Play background music');
  }
});
bgMusic.addEventListener('ended', () => {
  musicToggle.textContent = '▶ Play Music';
});
const cursor=$('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
window.addEventListener('scroll',()=>{$('progress').style.width=window.scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100+'%'});

const sc=$('stars-canvas'),sx=sc.getContext('2d');let stars=[];
function resizeStars(){sc.width=innerWidth;sc.height=innerHeight;stars=Array.from({length:160},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.5+.3,o:Math.random()*6,s:Math.random()*.5+.2}))}
function drawStars(){sx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{s.o+=s.s*.02;const op=(Math.sin(s.o)+1)/2*.8+.1;sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fillStyle=`rgba(255,200,220,${op})`;sx.fill()});requestAnimationFrame(drawStars)}
resizeStars();drawStars();addEventListener('resize',resizeStars);

const hb=$('hearts-bg'),he=['💖','💗','💕','💞','💓','🌸','✨'];
for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent=he[Math.random()*he.length|0];s.style.left=Math.random()*100+'%';s.style.fontSize=(Math.random()*1.2+.8)+'rem';s.style.animationDuration=(Math.random()*8+7)+'s';s.style.animationDelay=Math.random()*6+'s';hb.appendChild(s)}
for(let i=0;i<12;i++){const p=document.createElement('div');p.className='petal';p.textContent=['🌸','🌺','🌹','🌷'][Math.random()*4|0];p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*100+'vh';p.style.fontSize=(Math.random()*.8+.9)+'rem';p.style.animationDuration=(Math.random()*10+12)+'s';p.style.animationDelay=Math.random()*10+'s';$('petals').appendChild(p)}

function launchConfetti(){const c=$('confetti-container');c.style.display='block';const col=['#ff4d7a','#ffb3c6','#f7c59f','#ff8fab','#fff','#c2185b','#ffeb3b'];
for(let i=0;i<120;i++){const b=document.createElement('div');b.className='confetti-bit';b.style.left=Math.random()*100+'vw';b.style.background=col[Math.random()*col.length|0];b.style.width=(Math.random()*10+5)+'px';b.style.height=(Math.random()*10+5)+'px';b.style.borderRadius=Math.random()>.5?'50%':'2px';b.style.animationDuration=(Math.random()*2+2)+'s';b.style.animationDelay=Math.random()*.5+'s';c.appendChild(b)}
setTimeout(()=>{c.style.display='none';c.innerHTML=''},4000)}

const valentines=$('valentines');
let envOpenedOnce=false;
function toggleEnvelope(){
  const open=valentines.classList.toggle('is-open');
  valentines.setAttribute('aria-expanded',open);
  if(open&&!envOpenedOnce){envOpenedOnce=true;launchConfetti();}
}
valentines.addEventListener('click',toggleEnvelope);
valentines.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleEnvelope()}});

document.getElementById("valentines").addEventListener("click", function () {
    this.classList.toggle("open");

    setTimeout(() => {
        window.location.href = "letter\\letter.html";
    }, 3000); // 3 seconds
});

</script>
